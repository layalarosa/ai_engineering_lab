services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: memory_admin
      POSTGRES_DB: memory
      POSTGRES_PASSWORD: ${MEMORY_POSTGRES_PASSWORD:?Define MEMORY_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${MEMORY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - memory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_admin -d memory"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  memory_postgres:
