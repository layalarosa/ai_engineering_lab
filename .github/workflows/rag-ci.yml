name: RAG CI

on:
  push:
    paths: ['01-rag/**', '.github/workflows/rag-ci.yml']
  pull_request:
    paths: ['01-rag/**', '.github/workflows/rag-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: 01-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 01-rag/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Pruebas unitarias e integración con pgvector
        run: python -m unittest discover -s tests -v
        env:
          RAG_TEST_DATABASE_URL: postgresql://rag:ci-test-only@localhost:5432/rag_test
      - name: Construir imagen de RAG
        if: matrix.python == '3.12'
        run: docker build -t rag-ci .
      - name: Comprobar imagen de RAG
        if: matrix.python == '3.12'
        run: docker run --rm rag-ci --help
