name: Memory CI

on:
  push:
    paths: ['03-memory/**', '.github/workflows/memory-ci.yml']
  pull_request:
    paths: ['03-memory/**', '.github/workflows/memory-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: 03-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 03-memory/requirements-postgres.txt
      - name: Memoria en proceso sin dependencias externas
        run: python -S -m unittest discover -s tests -p test_memory.py -v
      - name: Instalar dependencia opcional de PostgreSQL
        run: python -m pip install -r requirements-postgres.txt
      - name: Pruebas sin base de datos
        env:
          MEMORY_TEST_DATABASE_URL: ''
          MEMORY_TEST_ADMIN_DATABASE_URL: ''
          MEMORY_PROVENANCE_TEST_DATABASE_URL: ''
          MEMORY_PROVENANCE_TEST_ADMIN_DATABASE_URL: ''
          MEMORY_PROVENANCE_TEMPORARY: ''
          MEMORY_COPY_TEST_DATABASE_URL: ''
          MEMORY_COPY_TEST_MARKER: ''
        run: python -m unittest discover -s tests -v
      - name: Integración con PostgreSQL temporal
        if: matrix.python == '3.12'
        timeout-minutes: 15
        run: python tests/postgres_fixture/run.py
