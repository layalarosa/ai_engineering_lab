worker_processes 1;
events { worker_connections 128; }
http {
    access_log off;
    error_log /dev/stderr warn;
    limit_req_zone $binary_remote_addr zone=perip:1m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_conn_zone $server_name zone=serverwide:1m;
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_header_timeout 10s;
        client_body_timeout 10s;
        client_body_buffer_size 1m;
        limit_req zone=perip burst=2 nodelay;
        limit_req_status 429;
        limit_conn connections 2;
        limit_conn serverwide 4;
        limit_conn_status 503;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            add_header Retry-After 10 always;
            add_header Cache-Control no-store always;
            return 429 '{"error":{"code":"rate_limited","message":"Límite de solicitudes alcanzado."}}';
        }
        location = /v1/answers {
            client_max_body_size 32000;
            include /etc/nginx/proxy_params_rag.conf;
        }
        location /v1/documents/ {
            client_max_body_size 1000000;
            include /etc/nginx/proxy_params_rag.conf;
        }
        location / { return 404; }
    }
}
